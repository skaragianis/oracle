[project]
name = "oracle"
version = "0.1.0"
description = "Use LLM's to ask questions of provided documents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.159.1",
    "fastembed>=0.9.0",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
oracle-cli = "oracle.cli.main:main"
oracle-server = "oracle.server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "embedding_model: loads the real embedding model (run via make backend-embedding-check)",
]
addopts = "-m 'not embedding_model'"
filterwarnings = [
    "error",
]

[tool.ruff.lint]
select = [
    "E", "F", "I",
    "ANN"
]

[tool.ty.rules]
all = "error"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
