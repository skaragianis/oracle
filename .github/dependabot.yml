version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 8
    groups:
      uv:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
      semver-major-days: 8
    groups:
      npm:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    # PrimeVue 5 / primeicons 8 moved from MIT to the PrimeUI License, which needs a license key.
    # Stay on the last MIT majors (primevue 4, primeicons 7).
    ignore:
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "primeicons"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primevue/*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native compiler; vue-tsc crashes on it with
      # ERR_PACKAGE_PATH_NOT_EXPORTED ./lib/tsc. Remove once vue-tsc supports TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      docker:
        update-types: ["minor", "patch"]
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns: ["*"]
