name: Docker CI

on:
  push:
    branches: [main, staging]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/docker_smoke.py'
      - 'Makefile'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/docker_smoke.py'
      - 'Makefile'
      - '.github/workflows/docker-ci.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: oracle-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The server downloads the embedding model at startup (~130MB), so even
      # /api/health waits on it. The container mounts this directory at /data/models.
      # Same path and key as e2e-ci.yml and embedding-ci.yml, so all three jobs share
      # one cache entry.
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: backend/data/models
          key: fastembed-bge-small-en-v1.5-${{ hashFiles('backend/uv.lock') }}
          restore-keys: fastembed-bge-small-en-v1.5-

      # The container writes the cache as root; the script chowns it back to the
      # runner user afterwards so the cache save can read it. backend/data is
      # dockerignored, so the downloaded models can't leak into the image.
      - name: Smoke-test the image
        run: make docker-smoke-run SMOKE_MODELS="$GITHUB_WORKSPACE/backend/data/models"
